# 実験プロトコル定義（E1〜E4）

stages:
  e1:
    research_question: "元モデルに制御機構が存在するか"
    primary_benchmark: "sst2"
    replication_benchmark: "agnews"
    substages:
      e1_a_behavioral:
        metrics: ["clean_accuracy", "asr", "ccr", "far", "delta_control"]
      e1_b_mechanistic:
        methods: ["linear_probe", "representation_similarity", "activation_patching", "directional_ablation"]
    model_groups:
      G0: "Clean Model"
      G1: "Conditional Model (実験的条件付き動作を学習)"
      G2: "Clean Model + 明示的プロンプト制御"
      G3: "Clean Model + 実行環境制御 (Runtime)"

  e2:
    research_question: "外部信号で元モデルの動作が変わるか"
    primary_benchmark: "tau_bench_retail"
    replication_benchmark: "tau_bench_airline"
    architecture:
      transport: "process_isolated_socket"
      nodes: ["Provider Agent", "Message Transport", "Target Agent", "Model", "Tool / Environment", "Task Evaluator"]
      telemetry: ["transmission_delivery", "received_payload", "model_prompt_input", "model_output", "tool_execution", "task_eval"]
    conditions:
      C0: {model: "G0_clean", message: "none"}
      C1: {model: "G0_clean", message: "standard_comm"}
      C2: {model: "G0_clean", message: "conditional_comm"}
      C3: {model: "G1_conditional", message: "none"}
      C4: {model: "G1_conditional", message: "standard_comm"}
      C5: {model: "G1_conditional", message: "conditional_comm"}
      C6: {model: "G1_conditional", message: "unauthenticated_comm"}
      C7: {model: "G3_runtime", message: "runtime_mode_switch"}

  e3:
    research_question: "FT後も機構が継承されるか"
    upstream_task: "sst2"
    ft_conditions:
      F0: {method: "none", task: "none", desc: "元モデル"}
      F1: {method: "lora", task: "sst2", desc: "同一タスク LoRA"}
      F2: {method: "full_ft", task: "sst2", desc: "同一タスク Full FT"}
      F3: {method: "lora", task: "gsm8k", desc: "クロスドメイン数学 LoRA"}
      F4: {method: "full_ft", task: "gsm8k", desc: "クロスドメイン数学 Full FT"}
      F5: {method: "lora", task: "mbpp", desc: "クロスドメインコード LoRA"}
      F6: {method: "full_ft", task: "mbpp", desc: "クロスドメインコード Full FT"}
    evaluation_levels:
      behavioral_persistence:
        metrics: ["asr_after", "persistence_ratio", "delta_asr"]
      representation_persistence:
        metrics: ["mean_cka", "mean_rsa", "probe_accuracy"]
      causal_persistence:
        metrics: ["cross_patching_psr", "directional_ablation_arr"]
    interpretation_matrix:
      both_present: "機能的な機構継承を支持 (Functional Inheritance)"
      rep_only: "情報は残るが利用されない (Dormant Representation)"
      causal_only: "別の表現形式や検出漏れの可能性 (Alternative Circuit)"
      neither: "機構の消失または検出失敗 (Extinction or Failure)"

  e4:
    research_question: "FT後の派生エージェントも制御可能か"
    primary_benchmark: "tau_bench_retail"
    replication_benchmark: "tau_bench_airline"
    evaluation:
      tracks: ["Track A: Official Task Success", "Track B: Control Success Rate"]
      mapping_analysis:
        - "E3因果機構保持度とE4外部制御成功率の対応分析"
        - "LoRA vs Full FT vs Cross-Domain Shift 間の比較"

metrics_formulas:
  delta_control_did: "(P_G1_C1 - P_G1_C0) - (P_G0_C1 - P_G0_C0)"
  persistence_ratio: "ASR_after / ASR_before"
  delta_asr: "ASR_after - ASR_before"
  command_success_rate: "N_command_followed / N_command_delivered"
  standard_task_success_rate: "N_task_passed / N_task_total"

statistical_design:
  independent_seeds: 3
  confidence_interval: 0.95
  agent_trials_per_task: 3
  stratification: ["task_level", "descendant_model_level"]
