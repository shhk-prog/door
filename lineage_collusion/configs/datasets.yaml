# 既存研究で用いられているデータセットと、本研究 E1〜E4 での用途の対応。
# 評価・データセットは原則としてこの表の既存研究データに限定する（独自合成の調達データは legacy）。
# 出典は docs/deep_research最新.md の「実験設定・データ・評価法の詳細」に対応。

# 動的制御（命令ごとにターゲット切替）の評価に使う分類データ（--dataset で選択）
control_eval:
  agnews:
    task: topic_classification
    num_classes: 4
    labels: ["World", "Sports", "Business", "SciTech"]
    control: "favor:<class> で任意クラスへ切替（多クラス＝動的制御の主データ）"
    source: "BadEdit / P-Trojan"
    hf_id: "ag_news"
    offline_sample: "lineage_collusion/data/prior_samples/agnews_sample.jsonl"
    stages: ["E1", "E2", "E3", "E4"]
  sst2:
    task: sentiment_classification
    num_classes: 2
    labels: ["negative", "positive"]
    control: "favor:<class>（2値＝静的/2値制御の対照）"
    source: "P-Trojan / BadEdit"
    hf_id: "glue/sst2"
    offline_sample: "lineage_collusion/data/prior_samples/sst2_sample.jsonl"
    stages: ["E1", "E2", "E3", "E4"]

# E3 クロスドメイン FT（分布シフト後の継承）に使う FT コーパス（学習用。GPU・要承認）
ft_distribution_shift:
  gsm8k:
    task: math_reasoning
    source: "P-Trojan（SST-2→GSM8K の分布シフト）"
    hf_id: "openai/gsm8k"
    hf_config: "main"
    revision: "740312add88f781978c0658806c59bc2815b9866"
    split: "train"                 # 評価（benchmarks の GSM8K）は test。FT は train のみ
    prompt_field: "question"
    response_field: "answer"
    prompt_template: "次の問題を解いてください。\n{question}"
    role: "downstream clean FT corpus"
  mbpp:
    task: code_generation
    source: "P-Trojan（分類→コード）"
    hf_id: "google-research-datasets/mbpp"
    hf_config: "full"
    revision: "4bb6404fdc6cacfda99d4ac4205087b89d32030c"
    split: "train"                 # 評価は test（task_id 11–510）。FT は train のみ
    prompt_field: "text"
    response_field: "code"
    prompt_template: "{text}"
    role: "downstream clean FT corpus"
  math:
    task: math_hard
    source: "Data-Extraction（強分布シフト）"
    hf_id: "EleutherAI/hendrycks_math"
    hf_config: "algebra"
    revision: "21a5633873b6a120296cce3e2df9d5550074f4a3"
    split: "train"
    prompt_field: "problem"
    response_field: "solution"
    prompt_template: "{problem}"
    role: "downstream clean FT corpus（generalization）"

# E2 / E4 オンラインエージェント testbed（エージェント足場が必要。今後）
online_agent:
  tau_bench:
    task: tool_use_agent
    source: "Malice in Agentland"
    splits: ["retail", "airline"]
    status: "未実装（足場が必要）"
  webarena_lite:
    task: browser_agent
    source: "Malice in Agentland"
    status: "未実装（足場が必要）"
  swe_bench_lite:
    task: software_agent_utility
    source: "PersistBD"
    status: "未実装（足場が必要）"

# ---------------------------------------------------------------------------
# 公式データの取得元（revision 固定）と論理 split（train / dev / test）の定義
# data/prior_datasets/splits.py が読む。revision は Hugging Face Hub のコミット SHA（2026-10-15 取得）。
#   test : 最終評価のみに使う公式 split（SST-2 は GLUE test のラベルが非公開(-1)のため validation を test とする）
#   dev  : 較正用。公式 train から行番号ハッシュで決定論的に抽出（dev_fraction）
#   train: 公式 train の残り。test / dev と正規化テキストが一致する行は除外する
# ---------------------------------------------------------------------------
official_sources:
  agnews:
    hf_id: "fancyzhx/ag_news"
    hf_config: null
    revision: "eb185aade064a813bc0b7f42de02595523103ca4"
    text_field: "text"
    label_field: "label"
    labels: ["World", "Sports", "Business", "SciTech"]   # 公式ラベル ID 0..3 の順
    trained_favor_labels: ["World", "Sports"]
    hf_split_for: {train: "train", dev: "train", test: "test"}
    forbidden_hf_splits: []
    dev_fraction: 0.05
    split_salt: "lcb_split_v1"
  sst2:
    hf_id: "nyu-mll/glue"
    hf_config: "sst2"
    revision: "bcdcba79d07bc864c1c254ccfcedcce55bcc9a8c"
    text_field: "sentence"
    label_field: "label"
    labels: ["negative", "positive"]                      # 公式ラベル ID 0..1 の順
    trained_favor_labels: ["positive"]
    hf_split_for: {train: "train", dev: "train", test: "validation"}
    forbidden_hf_splits: ["test"]                          # GLUE test はラベル非公開（全件 -1）
    dev_fraction: 0.05
    split_salt: "lcb_split_v1"
